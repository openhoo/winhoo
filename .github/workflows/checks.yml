name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foreground-probe:
    name: Foreground probe on Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile and run the windowless probe
        shell: powershell
        run: .\tests\windows-foreground.ps1

  unit-tests:
    name: Controller and launcher (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run controller and launcher unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
      - name: Check the desktop Docker build context in the source distribution
        if: matrix.python == '3.14'
        run: |
          python -m pip install build
          python -m build --sdist
          python - <<'PY'
          import pathlib, subprocess, tarfile

          files = [".dockerignore", "winhoo_desktop.py", "LICENSE", "THIRD_PARTY_NOTICES.md"]
          files += subprocess.check_output(["git", "ls-files", "desktop/"], text=True).splitlines()
          archive, = pathlib.Path("dist").glob("*.tar.gz")
          with tarfile.open(archive) as source:
              for name in files:
                  with source.extractfile(f"{archive.name[:-7]}/{name}") as member:
                      assert member.read() == pathlib.Path(name).read_bytes(), name
          PY
