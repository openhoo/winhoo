[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winhoo"
version = "0.1.0"
description = "Repeatable native Windows container installation and SSH automation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
winhoo = "winhoo:main"

[tool.setuptools]
py-modules = ["winhoo"]
